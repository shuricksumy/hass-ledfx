name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant ships monthly and deprecates aggressively; catch breakage
    # before a user does.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Home Assistant 2026.8 requires Python >= 3.14.2; an older
          # interpreter would quietly resolve to an older Home Assistant.
          python-version: "3.15"
          cache: pip
      - run: pip install -r requirements_test.txt
      - name: pytest
        # tests/test_live_ha.py skips itself unless LEDFX_HOST is set.
        run: pytest tests/ -q --cov --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
