name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant ships monthly and deprecates aggressively; catch breakage
    # before a user does.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.8 requires Python >= 3.14.2; an older
          # interpreter would quietly resolve to an older Home Assistant.
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - name: pytest
        # tests/test_live_ha.py skips itself unless LEDFX_HOST is set.
        run: pytest tests/ -q --cov --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
